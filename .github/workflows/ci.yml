name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Unit Tests
        run: |
          pytest tests/unit

      - name: Integration Tests
        run: |
          pytest tests/integration

      - name: Bandit
        run: |
          bandit -r app
